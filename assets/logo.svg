<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none">
  <defs>
    <linearGradient id="onyxBg" x1="20" y1="12" x2="108" y2="116" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E222D"/>
      <stop offset="55%" stop-color="#13161E"/>
      <stop offset="100%" stop-color="#0B0D12"/>
    </linearGradient>
    <radialGradient id="topGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(92 30) rotate(130) scale(76)">
      <stop offset="0%" stop-color="#4C8DFF" stop-opacity="0.34"/>
      <stop offset="65%" stop-color="#2F71E3" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#2F71E3" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glassRim" x1="64" y1="12" x2="64" y2="116" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.03"/>
    </linearGradient>
    <linearGradient id="docFill" x1="34" y1="28" x2="76" y2="88" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
    <linearGradient id="menuBg" x1="54" y1="54" x2="96" y2="98" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#23293A"/>
      <stop offset="100%" stop-color="#141824"/>
    </linearGradient>
    <linearGradient id="accentPill" x1="60" y1="67" x2="90" y2="67" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#78B6FF"/>
    </linearGradient>
    <filter id="cardShadow" x="46" y="48" width="58" height="60" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#05070B" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- Outer Onyx glass container (10% safe padding, crisp edge on both light & dark themes) -->
  <rect x="12" y="12" width="104" height="104" rx="26" fill="url(#onyxBg)"/>
  <rect x="12" y="12" width="104" height="104" rx="26" fill="url(#topGlow)"/>
  <rect x="12" y="12" width="104" height="104" rx="26" stroke="#0F172A" stroke-opacity="0.22" stroke-width="1"/>
  <rect x="12.75" y="12.75" width="102.5" height="102.5" rx="25.25" stroke="url(#glassRim)" stroke-width="1.5"/>

  <!-- Minimal folded document silhouette -->
  <path d="M41 29H63.5L78 43.5V77C78 81.4183 74.4183 85 70 85H41C36.5817 85 33 81.4183 33 77V37C33 32.5817 36.5817 29 41 29Z" fill="url(#docFill)"/>
  <path d="M63.5 29V39.5C63.5 41.7091 65.2909 43.5 67.5 43.5H78L63.5 29Z" fill="#94A3B8" fill-opacity="0.45"/>
  <rect x="42" y="49" width="18" height="3.2" rx="1.6" fill="#475569" fill-opacity="0.34"/>
  <rect x="42" y="57" width="12" height="3.2" rx="1.6" fill="#475569" fill-opacity="0.24"/>

  <!-- Floating context action menu card -->
  <g filter="url(#cardShadow)">
    <rect x="54" y="55" width="42" height="42" rx="12" fill="url(#menuBg)"/>
    <rect x="54.6" y="55.6" width="40.8" height="40.8" rx="11.4" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="1.2"/>
    <!-- Highlighted active action row -->
    <rect x="60" y="63" width="30" height="10" rx="4" fill="url(#accentPill)"/>
    <circle cx="65.2" cy="68" r="1.8" fill="#FFFFFF"/>
    <rect x="69.5" y="66.6" width="16.5" height="2.8" rx="1.4" fill="#FFFFFF" fill-opacity="0.95"/>
    <!-- Secondary action rows -->
    <rect x="61.5" y="78" width="23" height="3" rx="1.5" fill="#CBD5E1" fill-opacity="0.58"/>
    <rect x="61.5" y="85.5" width="16" height="3" rx="1.5" fill="#94A3B8" fill-opacity="0.4"/>
  </g>
</svg>
